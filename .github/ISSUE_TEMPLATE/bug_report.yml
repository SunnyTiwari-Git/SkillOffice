name: Bug report
description: A skill, manager or the helper tool did not behave as documented.
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or component
      description: For example marketing/seo-audit, the marketing manager, or the skilloffice helper.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: AI platform
      options: [Claude Code, Antigravity, Gemini CLI, Codex, Cursor, GitHub Copilot, Other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Do not paste company data, client data, credentials or personal information.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillOffice version
      description: From .skilloffice/lock.json, or the release you downloaded.
