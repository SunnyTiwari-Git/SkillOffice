version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/skilloffice-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep Node types on the major version CI runs (Node 24), so code cannot use newer-only APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
