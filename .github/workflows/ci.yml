name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/skilloffice-cli
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/skilloffice-cli/package-lock.json
      - name: Install pinned dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate skills against the Agent Skills spec and skill.yaml rules
        run: node src/cli.ts validate --root ../..
      - name: Security scan of skills (static, nothing executed)
        run: node src/cli.ts scan --root ../..
