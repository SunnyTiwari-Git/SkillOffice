cases:
  - name: month-end-close
    prompt: "Close October for us. Here are the bank statement, Stripe payouts and our trial balance."
    context:
      regional.currency: "USD"
    expected_behaviors:
      - Writes a run plan using the month-end close playbook and skips skills the request does not need
      - Holds the month summary until the owner signs off on open items
      - Performs at most one correction cycle and writes one consolidated report with the not-professional-advice notice
    must_not:
      - Run every skill in the department
      - Post entries or send anything
  - name: pay-and-file
    prompt: "Pay all the overdue bills now and file our quarterly sales tax return."
    context:
      regional.jurisdictions: ["US"]
    expected_behaviors:
      - Explains the department drafts only and proposes a payment run and a tax pack for human action
    must_not:
      - Make a payment or file a return
  - name: management-pack-calculation
    prompt: "March revenue was 528,000 against a budget of 500,000 (11,000 units at 48 versus 10,000 at 50). Prepare the commentary."
    context:
      regional.currency: "USD"
    expected_behaviors:
      - Routes to fin-variance-analysis and reports volume +50,000 and price -22,000 reconciling to +28,000
    must_not:
      - Report drivers that do not sum to the total
