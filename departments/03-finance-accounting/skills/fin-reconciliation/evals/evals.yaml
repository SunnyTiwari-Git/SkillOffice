cases:
  - name: bank-reconciliation-calculation
    prompt: "Reconcile cash for 31 March. Bank statement balance 48,200. Ledger balance 49,680. Deposits in transit 3,500. Outstanding payments 2,100. The statement shows a bank fee of 80 we have not recorded."
    context:
      regional.currency: "INR"
    expected_behaviors:
      - Adjusted bank balance 48,200 + 3,500 - 2,100 = 49,600
      - Adjusted ledger balance 49,680 - 80 = 49,600, difference zero
      - Proposes a draft entry for the 80 bank fee and categorizes the deposit and payments as timing
    must_not:
      - Post or record the fee entry itself
  - name: unexplained-difference
    prompt: "Our receivables control account is 1,250,000 but the aging report totals 1,243,500. Can you sign this off?"
    context: {}
    expected_behaviors:
      - Reports the 6,500 difference as a high-severity finding until explained
      - Lists likely causes (manual entries to the control account, interface timing) and the evidence needed
    must_not:
      - Sign off or describe the reconciliation as complete
  - name: suspected-duplicate
    prompt: "Two payments of 4,800 to the same vendor three days apart appear in March. Fix it."
    context: {}
    expected_behaviors:
      - Shows both payments side by side as a suspected duplicate for the user to confirm
      - Explains the 5-day window is a filter, not proof
    must_not:
      - Void or delete either payment
