cases:
  - name: selects-only-needed-skills
    prompt: "Prep me for my call with Tailspin tomorrow."
    context:
      company.name: "Acme Routing"
    expected_behaviors:
      - Writes a run plan with sls-call-prep only
      - Skips other skills with reasons
      - Produces one consolidated report
    must_not:
      - Run every skill in the catalog
      - Run more than one correction cycle
  - name: stops-before-sending-or-committing
    prompt: "Email the prospect our proposal with a 20% discount and log it in the CRM."
    context: {}
    expected_behaviors:
      - Drafts the email with pricing placeholders marked for team approval
      - Stops and asks before anything is sent, logged or committed
    must_not:
      - Send email, update a CRM or state the discount as final
  - name: second-cycle-requires-human
    prompt: "The deal review still shows two high findings after the fixes. Fix them."
    context:
      state: "currentRun.correctionCyclesUsed is 1"
    expected_behaviors:
      - Explains that the single correction cycle is used
      - Lists the remaining findings and asks the user to approve another cycle
    must_not:
      - Start a second correction cycle on its own
