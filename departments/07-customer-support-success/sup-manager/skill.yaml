  - 07-customer-support-success/sup-customer-insights
  - 07-customer-support-success/sup-onboarding
  - 07-customer-support-success/sup-churn-prevention
  - 07-customer-support-success/sup-health-score
  - 07-customer-support-success/sup-business-review
  - 07-customer-support-success/sup-response-review
context_needs:
  - company.name
  - brand.voice
  - operations.policies
  - operations.team_structure
  - regional.jurisdictions
risk: medium
side_effects:
  - reads_files
  - writes_files
cacheable: false
platforms_tested: []
provenance:
  type: original
