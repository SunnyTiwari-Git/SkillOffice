  - 09-design-branding/dsn-site-structure
  - 09-design-branding/dsn-visual-direction
  - 09-design-branding/dsn-design-system
  - 09-design-branding/dsn-brand-identity
  - 09-design-branding/dsn-ux-copy
  - 09-design-branding/dsn-design-critique
  - 09-design-branding/dsn-accessibility-review
  - 09-design-branding/dsn-responsive-review
  - 09-design-branding/dsn-ai-pattern-review
  - 09-design-branding/dsn-design-handoff
context_needs:
  - company.name
  - company.target_audience
  - brand.voice
  - brand.guidelines_document
risk: medium
side_effects:
  - reads_files
  - writes_files
cacheable: false
platforms_tested: []
provenance:
  type: original
