id: 09-design-branding/dsn-responsive-review
version: 0.1.0
kind: skill
department: 09-design-branding
summary: Reviews a page or component across screen widths - reflow, overflow, touch targets, navigation, type and images - and reports findings.
inputs:
  - name: design
    description: Page or component code, and/or screenshots at several widths
    required: true
  - name: device_data
    description: Device or screen-size breakdown from analytics
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format, each naming the width and element
  - name: width_table
    description: Status and notes per reviewed width
depends_on: []
context_needs:
  - technical.stack
  - company.target_audience
  - company.markets
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
