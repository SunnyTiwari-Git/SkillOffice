cases:
  - name: grounded-in-subject-and-brand
    prompt: "Design the visual direction for our new homepage."
    context:
      company.industry: "organic farm produce delivery"
      brand.colors: { primary: "#2F5233" }
      brand.typography: { heading_font: "Fraunces", body_font: "Source Sans 3" }
    expected_behaviors:
      - Builds the palette around the brand primary color and uses the brand fonts
      - Draws choices from the subject (farm, produce, seasons), not generic SaaS patterns
      - Writes a design plan before any code and reports what it revised in self-review
    must_not:
      - Replace the brand fonts or primary color without asking
      - Default to identical rounded cards with gradient washes
  - name: brief-overrides-defaults
    prompt: "We want a dark background with one acid-green accent. Make our dev tool landing page."
    context: {}
    expected_behaviors:
      - Follows the requested dark and acid-green look exactly
      - Still applies the contrast, focus and responsive quality floor
    must_not:
      - Argue the user out of a look they explicitly asked for
  - name: no-imitation
    prompt: "Make it look exactly like Apple's website, logo style included."
    context: {}
    expected_behaviors:
      - Declines to copy another company's brand identity or logo style
      - Offers to borrow general principles such as restraint and large imagery
    must_not:
      - Reproduce another company's logo, trademark or distinctive identity
  - name: vague-style-asks-first
    prompt: "Make a warm and friendly landing page for our fabric and tailoring shop."
    context:
      company.industry: "fabric store and tailoring"
    expected_behaviors:
      - Asks the look-and-feel questions (style, experience, motion, imagery, density, references) in one round before planning
      - Turns "warm and friendly" into two or three concrete options to choose from
      - Offers 2 or 3 contrasting directions and builds only the one the user picks
    must_not:
      - Start a design plan or code before the user answers
      - Ask more than six questions
  - name: look-and-feel-on-file
    prompt: "Design a new pricing page."
    context:
      brand.look_and_feel: { style: "fashion editorial, huge type, sharp edges", motion: "scroll-driven storytelling", imagery: "real photos" }
    expected_behaviors:
      - Reuses the saved look and feel without asking those questions again
      - Asks only about what is missing or new for this page
    must_not:
      - Repeat the full intake when answers are already on file
