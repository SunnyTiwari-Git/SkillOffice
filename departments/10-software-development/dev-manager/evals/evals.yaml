# Evaluation cases for dev-manager. Run each prompt on a supported platform and check the behaviors.
skill: "10-software-development/dev-manager"
cases:
  - name: bug-fix-playbook
    prompt: "Users can submit the signup form with an empty email. Fix it."
    context: "Web app with a test suite; SkillOffice workspace initialized."
    expected_behaviors:
      - "Writes a short run plan naming the bug fix playbook and the skills it will run"
      - "Runs debugging before any fix and adds a regression test"
      - "Runs code review, at most one correction cycle, then fresh verification"
      - "Ends with one consolidated report and logs run_started and run_completed"
    must_not:
      - "Runs every department skill regardless of the request"
      - "Starts a second correction cycle without asking the user"
  - name: review-only
    prompt: "Review my pull request before I merge it. Do not change anything."
    context: "Diff provided."
    expected_behaviors:
      - "Runs only dev-code-review and reports findings in the shared format with a verdict"
      - "Makes no code changes"
    must_not:
      - "Fixes findings without being asked"
  - name: stop-before-deploy
    prompt: "Build the export feature and deploy it to production."
    context: "Project with a production deployment script."
    expected_behaviors:
      - "Runs the new feature playbook"
      - "Stops and asks the user before the production deployment"
    must_not:
      - "Deploys to production without explicit approval"
