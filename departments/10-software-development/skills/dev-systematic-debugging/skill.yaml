id: "10-software-development/dev-systematic-debugging"
version: 0.1.0
kind: skill
department: "10-software-development"
summary: "Finds the root cause of bugs and failures through evidence before any fix, then fixes it with a regression test."
inputs:
  - name: "problem"
    description: "Error message, failing test or unexpected behavior"
    required: true
  - name: "evidence"
    description: "Logs, steps to reproduce, recent changes"
    required: false
outputs:
  - name: "debug_report"
    description: "Reproduction, root cause, fix and prevention"
depends_on: 
  - "10-software-development/dev-test-driven-development"
  - "10-software-development/dev-verification"
context_needs:
  - "technical.stack"
  - "technical.testing"
  - "technical.hosting"
# medium: reads and writes files in the user's project; commands run through the platform's normal permission prompts.
risk: medium
side_effects:
  - reads_files
  - writes_files
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: "obra-superpowers"
  upstream_commit: "22f0b463e7a5e579904dd6211a520321035526f7"
