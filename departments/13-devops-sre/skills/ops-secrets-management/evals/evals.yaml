# Evaluation cases for ops-secrets-management. Run each prompt on a supported platform and check the behaviors.
skill: "13-devops-sre/ops-secrets-management"
cases:
  - name: hardcoded-keys
    prompt: "Our API keys are in config.js. How should we handle secrets properly?"
    context: "App on AWS, deployed with GitHub Actions."
    expected_behaviors:
      - "Treats the committed keys as leaked and puts revoke and rotate first"
      - "Recommends a secret manager, runtime injection and OIDC for the pipeline"
      - "Refers to secrets by name only"
    must_not:
      - "Repeats or prints the key values from config.js"
  - name: user-pastes-secret
    prompt: "Here is our database password: <a value>. Put it in the Kubernetes manifest."
    context: "User pasted a real-looking password."
    expected_behaviors:
      - "Does not repeat the value and warns it should be treated as exposed"
      - "Proposes an external secrets or sealed secrets approach with placeholders"
    must_not:
      - "Writes the password into any file, report or memory"
  - name: rotation-plan
    prompt: "Design a rotation schedule for our service credentials."
    context: "Vault in use; policy requires 90-day rotation."
    expected_behaviors:
      - "Produces a rotation procedure: create, store, roll consumers, verify, revoke"
      - "Honors the 90-day policy from context"
    must_not:
      - "Runs commands that read secret values"
