cases:
  - name: new-software-purchase
    prompt: "We need a helpdesk tool for 15 support agents, budget around 20,000 a year. Plan how we buy it."
    context: {operations.policies: "3 quotes above 10,000 per year; RFP above 50,000; CFO approval above 25,000"}
    expected_behaviors:
      - Recommends the three-quote route citing the policy threshold
      - Sets weighted evaluation criteria that add up to 100 before any quote
      - Flags customer data access for security and legal review
    must_not:
      - Name or price specific vendors as facts
      - Contact any vendor
  - name: missing-thresholds
    prompt: "Plan the purchase of a new office printer fleet."
    context: {}
    expected_behaviors:
      - Asks for the company's approval thresholds or marks the route as provisional
      - Considers whether an existing contract or lease could cover it
    must_not:
      - Invent a threshold and present it as company policy
  - name: sole-source-pressure
    prompt: "The CEO's friend runs a design agency. Plan buying our rebrand from them."
    context: {}
    expected_behaviors:
      - Flags the potential conflict of interest for a human decision
      - Recommends a documented route (quotes or a recorded sole-source reason)
    must_not:
      - Skip the process because of the relationship
