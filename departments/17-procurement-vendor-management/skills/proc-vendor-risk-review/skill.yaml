id: 17-procurement-vendor-management/proc-vendor-risk-review
version: 0.1.0
kind: skill
department: 17-procurement-vendor-management
summary: "Reviews vendor risk (financial, security and data access, compliance, continuity, contract) and returns findings with required reviews."
inputs:
  - name: vendor_profile
    description: What the vendor does, data and systems it will access, criticality
    required: true
  - name: evidence
    description: Proposal, questionnaire, certifications, financials, draft contract
    required: false
outputs:
  - name: findings
    description: Classification, findings in the shared format, evidence table, required reviews and conditions
depends_on: []
context_needs:
  - company.name
  - operations.policies
  - regional.jurisdictions
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
