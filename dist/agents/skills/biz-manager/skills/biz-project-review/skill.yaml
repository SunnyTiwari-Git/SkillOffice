id: 16-operations-project-management/biz-project-review
version: 0.1.0
kind: skill
department: 16-operations-project-management
summary: Health-checks a project plan or running project and returns findings on scope, owners, schedule realism, risks and governance.
inputs:
  - name: project_documents
    description: Plan, schedule, RAID log, status reports or a description of the project
    required: true
  - name: capacity
    description: Team size, availability, budget and deadline
    required: false
outputs:
  - name: findings
    description: Verdict, findings in the shared format, passed checks and three priority actions
depends_on: []
context_needs:
  - operations.team_structure
  - regional.date_format
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
