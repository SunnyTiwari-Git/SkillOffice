id: 15-data-analytics-ai/data-storytelling
version: 0.2.0
kind: skill
department: 15-data-analytics-ai
summary: Turns provided analysis results into an honest, audience-specific narrative with one message, evidence, caveats and a specific ask.
inputs:
  - name: analysis
    description: Findings, tables, charts and caveats from the analysis
    required: true
  - name: audience
    description: Audience, the decision they own and the format needed
    required: true
  - name: recommendation
    description: The recommendation the user has in mind and any constraints
    required: false
outputs:
  - name: story
    description: Narrative draft in the requested format with a number-to-source list
depends_on: []
context_needs:
  - company.name
  - company.description
  - brand.voice
  - regional.currency
  - regional.date_format
  - regional.output_language
risk: low
side_effects:
  - reads_files
cacheable: false
asks_first: true
platforms_tested: []
provenance:
  type: adapted
  source_id: wshobson-agents
  upstream_commit: 4bde3168b43c0655c4d00ea2726e631719908a6d
