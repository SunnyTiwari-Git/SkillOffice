id: 09-design-branding/dsn-ai-pattern-review
version: 0.1.0
kind: skill
department: 09-design-branding
summary: Flags generic, template-like or AI-typical design patterns as quality indicators (never proof of authorship) with brand-specific fixes.
inputs:
  - name: design
    description: Screenshots, page code, component files or a description
    required: true
  - name: brief
    description: Brief and visual direction, to exclude deliberate choices
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format with company-specific alternatives
  - name: keep_list
    description: Distinctive elements worth keeping
depends_on: []
context_needs:
  - company.industry
  - company.description
  - brand.voice
  - brand.colors
  - brand.typography
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
