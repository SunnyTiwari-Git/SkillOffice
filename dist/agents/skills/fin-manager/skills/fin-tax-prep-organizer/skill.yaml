id: 03-finance-accounting/fin-tax-prep-organizer
version: 0.1.0
kind: skill
department: 03-finance-accounting
summary: Organizes a tax-season pack for the adviser from closed books; checklist, payee review, gaps and questions; no advice, no filing.
inputs:
  - name: tax_period
    description: The tax period and the deadline being prepared for
    required: true
  - name: closed_books
    description: Closed books for the period, or the open months to close first
    required: true
  - name: payee_detail
    description: Payments by payee and payee records on file
    required: false
outputs:
  - name: tax_pack
    description: Books status, document checklist, payee table, gaps, adviser questions and pack summary
depends_on:
  - 03-finance-accounting/fin-month-end-close
context_needs:
  - company.name
  - company.business_model
  - company.markets
  - regional.jurisdictions
  - regional.currency
  - regional.date_format
risk: low
side_effects:
  - reads_files
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
