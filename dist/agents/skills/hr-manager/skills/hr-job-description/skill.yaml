id: "02-hr-people-ops/hr-job-description"
version: 0.1.0
kind: skill
department: "02-hr-people-ops"
summary: "Writes an inclusive job ad and a resume screening rubric from a hiring brief; reviews existing ads for biased or unlawful wording."
inputs:
  - name: "hiring_brief"
    description: "Role, team, purpose, success measures, location, schedule and requirements"
    required: true
  - name: "pay_range"
    description: "Pay range and benefits, if the company will publish them"
    required: false
  - name: "existing_ad"
    description: "An existing job ad to improve or review"
    required: false
outputs:
  - name: "job_ad"
    description: "Job ad draft in the company's voice"
  - name: "screening_rubric"
    description: "Must-have, should-have and nice-to-have criteria with weights"
  - name: "findings"
    description: "Bias and legality findings when reviewing an existing ad"
depends_on: []
context_needs:
  - "company.name"
  - "company.description"
  - "company.size"
  - "operations.policies"
  - "regional.jurisdictions"
  - "regional.currency"
  - "regional.output_language"
  - "brand.voice"
# low: reads the brief or ad the user provides and returns drafts.
risk: low
side_effects:
  - reads_files
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: "anthropics-knowledge-work-plugins"
  upstream_commit: "ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d"
