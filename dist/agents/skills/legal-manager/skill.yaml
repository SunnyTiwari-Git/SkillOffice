id: "04-legal-risk-compliance/legal-manager"
version: 0.1.1
kind: manager
department: "04-legal-risk-compliance"
summary: "Coordinates Legal, Risk and Compliance: plans skills, runs them in order, merges findings, one correction cycle, one report; drafts only, for counsel."
inputs:
  - name: "request"
    description: "The user's legal, risk or compliance request with documents"
    required: true
outputs:
  - name: "report"
    description: "Consolidated report with the not-legal-advice notice, assumed jurisdictions and items for counsel"
depends_on:
  - "04-legal-risk-compliance/legal-contract-review"
  - "04-legal-risk-compliance/legal-nda-triage"
  - "04-legal-risk-compliance/legal-vendor-terms-check"
  - "04-legal-risk-compliance/legal-compliance-check"
  - "04-legal-risk-compliance/legal-risk-assessment"
  - "04-legal-risk-compliance/legal-privacy-review"
  - "04-legal-risk-compliance/legal-policy-drafting"
  - "04-legal-risk-compliance/legal-response-draft"
  - "04-legal-risk-compliance/legal-matter-brief"
context_needs:
  - "company.name"
  - "operations.policies"
  - "regional.jurisdictions"
  - "regional.date_format"
# medium: writes memory and reports in the user's project.
risk: medium
side_effects:
  - reads_files
  - writes_files
cacheable: false
platforms_tested: []
provenance:
  type: original
