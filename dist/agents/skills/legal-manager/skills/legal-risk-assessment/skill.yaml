id: "04-legal-risk-compliance/legal-risk-assessment"
version: 0.1.0
kind: skill
department: "04-legal-risk-compliance"
summary: "Scores legal and operational risks with a 5 by 5 matrix, maintains a risk register with owners and reviews, and recommends escalation."
inputs:
  - name: "matter"
    description: "The deal, contract, vendor, dispute, project or decision, with known facts"
    required: true
  - name: "register"
    description: "Existing risk register to update"
    required: false
outputs:
  - name: "register"
    description: "Risk register table with scores, owners, responses and review dates"
  - name: "memos"
    description: "Short memos for high and critical risks"
depends_on: []
context_needs:
  - "company.name"
  - "company.size"
  - "company.industry"
  - "operations.policies"
  - "operations.team_structure"
  - "regional.jurisdictions"
  - "regional.currency"
# low: reads the user's files; the register is returned in the response.
risk: low
side_effects:
  - reads_files
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: "anthropics-knowledge-work-plugins"
  upstream_commit: "ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d"
