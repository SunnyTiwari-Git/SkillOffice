id: 05-sales-business-development/sls-deal-review
version: 0.1.0
kind: skill
department: 05-sales-business-development
summary: Reviews one deal for health, stage reality and gaps to close as findings; drafts a business case and mutual action plan on request.
inputs:
  - name: deal_data
    description: Deal record fields or an export row, plus any notes, transcripts or threads
    required: true
  - name: mode
    description: Health review (default), advance gap, or close plan
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format
  - name: deal_assessment
    description: Health verdict, adjusted probability, qualification table, next actions and record update checklist
  - name: close_plan
    description: Business case and mutual action plan drafts, in close-plan mode
depends_on: []
context_needs:
  - operations.processes
  - company.differentiators
  - regional.currency
  - regional.date_format
risk: low
side_effects:
  - none
cacheable: true
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
