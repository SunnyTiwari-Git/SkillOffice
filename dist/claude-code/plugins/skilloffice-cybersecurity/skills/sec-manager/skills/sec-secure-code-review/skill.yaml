id: "14-cybersecurity/sec-secure-code-review"
version: 0.1.0
kind: skill
department: "14-cybersecurity"
summary: "Read-only security review of code: input-to-sink tracing, auth, injection, XSS, SSRF, files, sessions, secrets and config, with evidence and fixes."
inputs:
  - name: "code"
    description: "Repository, folders, files or a diff the user owns"
    required: true
  - name: "threat_model"
    description: "Threat model or focus paths from sec-threat-model"
    required: false
outputs:
  - name: "findings"
    description: "Findings in the shared format with strengths and coverage limits"
depends_on: []
context_needs:
  - "technical.stack"
  - "technical.languages"
  - "technical.standards"
  - "technical.website_architecture"
  - "technical.hosting"
# low: read-only review of the user's files.
risk: low
side_effects:
  - reads_files
# Security results are never cached.
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: "openai-skills"
  upstream_commit: "49f948faa9258a0c61caceaf225e179651397431"
