id: "14-cybersecurity/sec-security-policy"
version: 0.1.0
kind: skill
department: "14-cybersecurity"
summary: "Drafts and reviews practical security policies sized to the company, with owners and review cadence. Not legal advice; compliance items go to legal."
inputs:
  - name: "request"
    description: "Policies needed, or existing policy documents to review"
    required: true
  - name: "drivers"
    description: "Customer questionnaire, framework or contract driving the request"
    required: false
outputs:
  - name: "policies"
    description: "Policy drafts, summary table, new commitments needing approval, legal review items"
  - name: "findings"
    description: "Gaps in existing policies in the shared format"
depends_on: []
context_needs:
  - "company.name"
  - "company.size"
  - "company.industry"
  - "company.markets"
  - "operations.team_structure"
  - "operations.tools"
  - "operations.policies"
  - "regional.jurisdictions"
  - "regional.output_language"
# low: reads the user's documents; returns drafts as text.
risk: low
side_effects:
  - reads_files
# Security results are never cached.
cacheable: false
platforms_tested: []
provenance:
  type: original
