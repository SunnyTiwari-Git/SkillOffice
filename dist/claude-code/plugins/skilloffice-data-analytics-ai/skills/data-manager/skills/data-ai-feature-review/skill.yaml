id: 15-data-analytics-ai/data-ai-feature-review
version: 0.1.0
kind: skill
department: 15-data-analytics-ai
summary: Reviews an AI or LLM feature for data privacy, manipulated inputs, evaluation, wrong answers, human oversight, cost and lock-in; returns findings.
inputs:
  - name: feature
    description: Design, spec, prompts, code or description of the AI feature
    required: true
  - name: deployment_details
    description: Model, provider, expected volume, affected users, evaluation results or incidents
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format
  - name: review
    description: Verdict, data flow table, passed checks and open questions
depends_on: []
context_needs:
  - company.industry
  - company.products_and_services
  - technical.stack
  - technical.hosting
  - regional.jurisdictions
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
