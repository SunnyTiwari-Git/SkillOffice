id: 15-data-analytics-ai/data-dictionary
version: 0.1.0
kind: skill
department: 15-data-analytics-ai
summary: Documents entities, tables, metric definitions, standard filters and gotchas into a data dictionary file through interviews and schema exports.
inputs:
  - name: schema
    description: Schema export, key table list or discovery query results
    required: true
  - name: interview_answers
    description: Answers about entities, identifiers, metrics, filters and gotchas
    required: false
  - name: existing_dictionary
    description: An existing data dictionary and the domain to add
    required: false
outputs:
  - name: data_dictionary
    description: Data dictionary file(s) in the user's project and a summary with open questions
depends_on: []
context_needs:
  - company.business_model
  - company.products_and_services
  - operations.tools
  - technical.stack
  - regional.time_zone
risk: medium
side_effects:
  - reads_files
  - writes_files
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
