id: 15-data-analytics-ai/data-validation
version: 0.1.0
kind: skill
department: 15-data-analytics-ai
summary: Reviews an analysis, query, chart, dataset or pipeline for correctness and data quality; returns findings and a ready, caveats or revise verdict.
inputs:
  - name: material
    description: The analysis, SQL with results, chart, dataset or pipeline tests to review
    required: true
  - name: reference_figures
    description: Known trusted numbers and the intended audience
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format
  - name: verdict
    description: Ready, share with caveats or needs revision, with spot-check table and passed checks
depends_on: []
context_needs:
  - company.business_model
  - regional.currency
  - regional.time_zone
  - regional.jurisdictions
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
