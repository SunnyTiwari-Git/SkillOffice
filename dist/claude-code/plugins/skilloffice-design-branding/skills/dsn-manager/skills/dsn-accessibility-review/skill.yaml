id: 09-design-branding/dsn-accessibility-review
version: 0.1.0
kind: skill
department: 09-design-branding
summary: Audits a design or page against WCAG 2.2 AA and reports findings with the criterion and fix; critical findings block ready status.
inputs:
  - name: design
    description: Page or component code, screenshots or a detailed description
    required: true
  - name: scope
    description: Page, flow or component to audit
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format, each citing a WCAG 2.2 criterion
  - name: contrast_table
    description: Computed contrast ratios with pass or fail
depends_on: []
context_needs:
  - brand.colors
  - regional.jurisdictions
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
