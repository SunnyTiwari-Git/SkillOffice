# SkillOffice department registry.
# status: pilot (being built first), planned (software-company departments, built in waves),
#         active (released), later (after the software-company set).

departments:
  - slug: 00-shared-productivity
    number: 0
    name: Shared Productivity
    status: pilot
    manager: sp-manager
    scope: Meeting notes, emails, documents, research briefs, task planning, summaries, presentation outlines, translation and writing review, used by every department
    boundaries: General-purpose helpers only; department-specific work belongs to that department

  - slug: 01-executive-strategy
    number: 1
    name: Executive Management and Strategy
    status: pilot
    manager: exe-manager
    scope: Strategy reviews, OKRs, business cases, decision memos, board updates, KPI reviews, competitive strategy, executive briefings and plan stress tests
    boundaries: Financial modeling details go to Finance; legal review goes to Legal

  - slug: 02-hr-people-ops
    number: 2
    name: Human Resources and People Operations
    status: pilot
    manager: hr-manager
    scope: Job descriptions, recruiting, interview kits, offer letter drafts, onboarding, performance reviews, compensation analysis, HR policies and org planning
    boundaries: Employment law questions go to Legal; payroll calculations go to Finance

  - slug: 03-finance-accounting
    number: 3
    name: Finance and Accounting
    status: pilot
    manager: fin-manager
    scope: Journal entries, reconciliations, month-end close, financial statements, variance analysis, cash-flow forecasts, invoicing and collections drafts, audit preparation and tax document organizing
    boundaries: Purchasing and vendor selection go to Procurement

  - slug: 04-legal-risk-compliance
    number: 4
    name: Legal, Risk and Compliance
    status: pilot
    manager: legal-manager
    scope: Contract and NDA review, vendor terms, compliance checks, risk registers, privacy reviews (GDPR, DPDP, CCPA and more), policy drafting, legal response drafts and matter briefs
    boundaries: Security controls go to Cybersecurity; this department covers legal and regulatory meaning

  - slug: 05-sales-business-development
    number: 5
    name: Sales and Business Development
    status: pilot
    manager: sls-manager
    scope: Account research, prospecting, outreach drafts, call prep and summaries, objection handling, deal and pipeline reviews, battlecards, win-loss reviews and sales enablement
    boundaries: Campaigns and content go to Marketing; post-sale accounts go to Customer Success

  - slug: 06-marketing-content-pr
    number: 6
    name: Marketing, Content and PR
    status: pilot
    manager: mkt-manager
    scope: Marketing plans, content strategy, copywriting and editing, SEO audits, email sequences, social content, PR, brand review and performance reports
    boundaries: Visual design production goes to Design; online store operations go to E-commerce (later)

  - slug: 07-customer-support-success
    number: 7
    name: Customer Support and Customer Success
    status: pilot
    manager: sup-manager
    scope: Ticket triage, reply drafts, escalations, knowledge base articles, customer insights, onboarding, churn prevention, health scores, business reviews and reply review
    boundaries: Bugs go to Software Development; contract changes go to Sales or Legal

  - slug: 08-product-management
    number: 8
    name: Product Management and Research
    status: pilot
    manager: pm-manager
    scope: Product brainstorming, research synthesis, competitive briefs, PRDs and PRD review, roadmaps, sprint planning, metrics reviews and stakeholder updates
    boundaries: Interface design goes to Design; implementation goes to Software Development

  - slug: 09-design-branding
    number: 9
    name: UI/UX, Graphic Design and Branding
    status: pilot
    manager: dsn-manager
    scope: User research, site structure, visual direction, design systems, brand identity, UX copy, design critique, accessibility, responsive and AI-pattern reviews, and developer handoff
    boundaries: Front-end code goes to Software Development; campaign strategy goes to Marketing

  - slug: 10-software-development
    number: 10
    name: Software Development and Engineering
    status: pilot
    manager: dev-manager
    scope: Requirements, system design, implementation plans, test-driven development, debugging, code review, documentation, tech debt and verification
    boundaries: Test strategy goes to QA; infrastructure and deployment go to DevOps; security audits go to Cybersecurity

  - slug: 11-quality-assurance
    number: 11
    name: Quality Assurance and Testing
    status: pilot
    manager: qa-manager
    scope: Test strategy and plans, test case design, exploratory, web UI and API testing, regression suite review, bug reports and release verification (software)
    boundaries: Manufacturing quality control belongs to Supply Chain (later)

  - slug: 12-it-operations
    number: 12
    name: IT Operations and Technical Support
    status: pilot
    manager: it-manager
    scope: Help desk triage, access requests, joiners and leavers, runbooks, change management, asset inventory, SaaS management, troubleshooting and backup reviews (internal IT)
    boundaries: Product infrastructure goes to DevOps

  - slug: 13-devops-sre
    number: 13
    name: Cloud Infrastructure, DevOps and SRE
    status: pilot
    manager: ops-manager
    scope: CI/CD pipelines, secrets management, infrastructure as code, Kubernetes, observability, SLOs, incident response, postmortems, cloud cost reviews and deploy verification (product infrastructure)
    boundaries: Employee devices and SaaS admin go to IT Operations

  - slug: 14-cybersecurity
    number: 14
    name: Cybersecurity
    status: pilot
    manager: sec-manager
    scope: Threat modeling, secure code review, security requirements and mitigations, SAST setup, dependency and secrets reviews, security policies and incident triage (defensive only)
    boundaries: Regulatory interpretation goes to Legal

  - slug: 15-data-analytics-ai
    number: 15
    name: Data, Analytics and AI
    status: pilot
    manager: data-manager
    scope: Data exploration, SQL, analysis, visualization, dashboards, data validation, data storytelling, data dictionaries and AI feature reviews
    boundaries: Application code around models goes to Software Development

  - slug: 16-operations-project-management
    number: 16
    name: Business Operations and Project Management
    status: pilot
    manager: biz-manager
    scope: Project plans, RAID logs, status reports, capacity plans, change requests, process documentation and improvement, project health checks and facilities administration
    boundaries: Vendor sourcing goes to Procurement

  - slug: 17-procurement-vendor-management
    number: 17
    name: Procurement and Vendor Management
    status: pilot
    manager: proc-manager
    scope: Sourcing plans, RFPs, vendor evaluation, vendor risk reviews, purchase request drafts, spend analysis, contract renewals and supplier scorecards
    boundaries: Contract legal review goes to Legal; payments go to Finance

  - slug: 18-ecommerce-retail
    number: 18
    name: E-commerce and Retail Operations
    status: later
    scope: Product listings, marketplaces, merchandising, store operations, returns
    boundaries: Campaigns go to Marketing; logistics go to Supply Chain

  - slug: 19-supply-chain-logistics
    number: 19
    name: Supply Chain, Logistics and Manufacturing
    status: later
    scope: Inventory, demand planning, warehousing, shipping, production, quality control
    boundaries: Supplier contracts go to Procurement and Legal

# Industry packs (later): healthcare-admin, education, hospitality, professional-services, real-estate, logistics, manufacturing
