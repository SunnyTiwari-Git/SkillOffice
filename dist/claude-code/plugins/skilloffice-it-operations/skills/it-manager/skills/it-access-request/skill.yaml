id: 12-it-operations/it-access-request
version: 0.1.0
kind: skill
department: 12-it-operations
summary: "Turns access requests into least-privilege grants with named approvers and expiry dates, and flags admin or broad access."
inputs:
  - name: request
    description: Who needs access, to which system, why and for how long
    required: true
  - name: access_policy
    description: Role-based access matrix or access policy
    required: false
outputs:
  - name: access_decision
    description: Recommended access level, high-risk flags, approvers, expiry, ticket and reply drafts
depends_on: []
context_needs:
  - company.name
  - operations.tools
  - operations.policies
  - operations.team_structure
risk: low
side_effects:
  - reads_files
cacheable: false
platforms_tested: []
provenance:
  type: original
