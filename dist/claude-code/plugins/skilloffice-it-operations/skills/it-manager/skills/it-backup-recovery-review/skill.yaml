id: 12-it-operations/it-backup-recovery-review
version: 0.1.0
kind: skill
department: 12-it-operations
summary: "Reviews backup coverage, ransomware-safe copies, restore testing, retention and recovery targets; returns findings."
inputs:
  - name: backup_setup
    description: Systems and data, backup tools, schedules, copy locations, last restore test
    required: true
  - name: recovery_targets
    description: Recovery time and data-loss targets per system
    required: false
outputs:
  - name: findings
    description: Coverage table, findings in the shared format, actions and a restore test plan
depends_on: []
context_needs:
  - company.name
  - operations.tools
  - operations.policies
  - regional.jurisdictions
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
