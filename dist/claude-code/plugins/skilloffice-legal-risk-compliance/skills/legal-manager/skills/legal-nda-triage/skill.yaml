id: "04-legal-risk-compliance/legal-nda-triage"
version: 0.1.0
kind: skill
department: "04-legal-risk-compliance"
summary: "Screens an NDA and classifies it green, yellow or red with quoted findings and suggested fixes; recommends a route, never approves."
inputs:
  - name: "nda"
    description: "The NDA file or text"
    required: true
  - name: "purpose"
    description: "Business purpose and whether the company discloses, receives or both"
    required: true
  - name: "nda_standards"
    description: "The company's NDA standards, if any"
    required: false
outputs:
  - name: "classification"
    description: "Green, yellow or red with a recommended route"
  - name: "findings"
    description: "Findings in the shared format with quoted clauses and fixes"
depends_on: []
context_needs:
  - "company.name"
  - "operations.policies"
  - "regional.jurisdictions"
# low: read-only review of the user's files.
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: adapted
  source_id: "anthropics-knowledge-work-plugins"
  upstream_commit: "ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d"
