id: 06-marketing-content-pr/mkt-marketing-plan
version: 0.1.0
kind: skill
department: 06-marketing-content-pr
summary: Builds a campaign brief or full marketing plan by funnel stage, with roadmap, channels, budget and metrics fitted to real constraints.
inputs:
  - name: goal
    description: What the plan must achieve, ideally with a number and a date
    required: true
  - name: scope
    description: Campaign brief or full plan
    required: false
  - name: constraints
    description: Budget, team, timeline, current channels and past results
    required: false
outputs:
  - name: plan
    description: Markdown marketing plan or campaign brief with roadmap, metrics and open decisions
depends_on: []
context_needs:
  - company.name
  - company.description
  - company.products_and_services
  - company.business_model
  - company.markets
  - company.differentiators
  - brand.voice
  - marketing.ideal_customers
  - marketing.channels
  - marketing.campaign_preferences
  - marketing.competitors
  - regional.currency
  - regional.date_format
risk: low
side_effects:
  - none
cacheable: true
platforms_tested: []
provenance:
  type: adapted
  source_id: coreyhaines31-marketingskills
  upstream_commit: 88c79f6528a9347420e57ceb1fff9a60de651768
