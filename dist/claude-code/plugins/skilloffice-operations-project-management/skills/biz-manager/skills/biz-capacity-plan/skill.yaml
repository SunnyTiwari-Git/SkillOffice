id: 16-operations-project-management/biz-capacity-plan
version: 0.1.0
kind: skill
department: 16-operations-project-management
summary: Plans team capacity against demand with visible arithmetic, gaps, bottlenecks and hire, contract or deprioritize scenarios.
inputs:
  - name: team
    description: Roles, headcount, working hours, leave and routine workload
    required: true
  - name: demand
    description: Current and upcoming work with effort estimates and target periods
    required: true
outputs:
  - name: capacity_plan
    description: Capacity table, bottlenecks, scenarios, recommendation and assumptions
depends_on: []
context_needs:
  - company.size
  - operations.team_structure
  - regional.date_format
  - regional.time_zone
risk: low
side_effects:
  - reads_files
cacheable: false
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
