id: 17-procurement-vendor-management/proc-supplier-scorecard
version: 0.1.0
kind: skill
department: 17-procurement-vendor-management
summary: "Scores supplier performance on quality, delivery, cost, service and risk against targets, with findings and a recommended action."
inputs:
  - name: targets
    description: Contract SLAs or agreed targets
    required: false
  - name: performance_data
    description: Deliveries, defects, incidents, invoices and support data for the period
    required: true
outputs:
  - name: findings
    description: Scorecard, findings in the shared format, remedies and recommended action
depends_on: []
context_needs:
  - company.name
  - operations.policies
  - regional.currency
  - regional.date_format
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
