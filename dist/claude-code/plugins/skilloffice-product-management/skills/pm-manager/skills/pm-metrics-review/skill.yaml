id: 08-product-management/pm-metrics-review
version: 0.1.0
kind: skill
department: 08-product-management
summary: Reviews user-provided product metrics into a scorecard, trend analysis, metric-health findings and recommended actions.
inputs:
  - name: metrics_data
    description: Metrics for the period with comparison values and targets
    required: true
  - name: period
    description: Time period and focus of the review
    required: true
  - name: known_events
    description: Launches, incidents, campaigns or holidays that may explain changes
    required: false
outputs:
  - name: findings
    description: Metric-health findings in the shared SkillOffice format
  - name: scorecard
    description: Scorecard, trend analysis, bright spots and recommended actions
depends_on: []
context_needs:
  - company.business_model
  - company.products_and_services
  - regional.currency
  - regional.date_format
  - regional.time_zone
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: adapted
  source_id: anthropics-knowledge-work-plugins
  upstream_commit: ab4cb1cd383b4eb87383be8cf4e70cb5b2a2348d
