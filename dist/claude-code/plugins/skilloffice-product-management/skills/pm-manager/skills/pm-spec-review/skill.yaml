id: 08-product-management/pm-spec-review
version: 0.1.0
kind: skill
department: 08-product-management
summary: Reviews a spec or PRD for problem clarity, measurable metrics, testable requirements, edge cases, risks, privacy and accessibility.
inputs:
  - name: spec
    description: The spec, PRD, feature brief or user stories to review
    required: true
  - name: evidence
    description: Research or data the spec is based on
    required: false
outputs:
  - name: findings
    description: Findings in the shared SkillOffice format, with a readiness verdict and suggested rewrites
depends_on: []
context_needs:
  - company.target_audience
  - technical.standards
  - regional.jurisdictions
  - regional.output_language
risk: low
side_effects:
  - reads_files
cacheable: true
platforms_tested: []
provenance:
  type: original
