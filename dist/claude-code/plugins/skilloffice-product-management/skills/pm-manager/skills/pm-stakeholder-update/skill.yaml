    description: Progress, metrics, blockers, risks, decisions and next steps
    required: true
  - name: audience_and_type
    description: Audience (executives, engineering, partners, customers, board) and update type
    required: true
outputs:
  - name: update_draft
    description: Update draft for the stated channel, plus items needing confirmation before sending
