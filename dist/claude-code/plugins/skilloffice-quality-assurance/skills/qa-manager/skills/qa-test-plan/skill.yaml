id: "11-quality-assurance/qa-test-plan"
version: 0.1.0
kind: skill
department: "11-quality-assurance"
summary: "Writes a test plan: scope in and out, approach per area, environments, roles, placeholder schedule, risks, criteria and deliverables."
inputs:
  - name: "scope"
    description: "Release or feature scope: stories, requirements, acceptance criteria, change list"
    required: true
  - name: "strategy"
    description: "Test strategy from qa-test-strategy"
    required: false
outputs:
  - name: "test_plan"
    description: "Test plan document with date placeholders and stated assumptions"
# No hard dependency: small plans can proceed without a strategy. The skill recommends qa-test-strategy for large or risky scope.
depends_on: []
context_needs:
  - "company.name"
  - "technical.testing"
  - "technical.deployment_process"
  - "operations.team_structure"
  - "operations.tools"
  - "regional.date_format"
  - "regional.output_language"
risk: low
side_effects:
  - none
cacheable: true
platforms_tested: []
provenance:
  type: original
