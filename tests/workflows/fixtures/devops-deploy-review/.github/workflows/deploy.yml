name: deploy
on: [push]
permissions: write-all
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: npm install
      - run: npm test || true
      - run: docker build -t northwind/shop:latest .
      - run: docker push northwind/shop:latest
      - run: kubectl apply -f k8s/
