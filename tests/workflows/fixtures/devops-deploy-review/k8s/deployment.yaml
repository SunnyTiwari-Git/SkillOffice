apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
        - name: shop
          image: northwind/shop:latest
          ports: [{ containerPort: 3000 }]
          securityContext: { privileged: true }
          env:
            - name: DATABASE_URL
              value: "postgres://shop:CHANGE_ME@db:5432/shop"
